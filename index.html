<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07060d">
<title>Lost Explorer - Tower Trial</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07060d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#game{position:relative;width:360px;height:640px;flex:none;overflow:hidden;background:#000;font-family:"Courier New",Courier,monospace;font-weight:bold;color:#f4ecd8;transform-origin:50% 50%;text-shadow:1px 1px 0 #000}
#cv{position:absolute;left:0;top:0;width:360px;height:640px;image-rendering:pixelated;image-rendering:crisp-edges}
#touch{position:absolute;inset:0;touch-action:none}
.hide{display:none!important}
button{font-family:inherit;font-weight:bold;color:#f4ecd8;cursor:pointer;touch-action:manipulation;text-shadow:1px 1px 0 #000;-webkit-tap-highlight-color:transparent}
.btn{background:#2a2545;border:2px solid #000;box-shadow:inset 0 -3px 0 #16132a,inset 0 0 0 2px #5a5296;padding:7px 12px;font-size:13px;letter-spacing:1px}
.btn:active{transform:translateY(1px);box-shadow:inset 0 -1px 0 #16132a,inset 0 0 0 2px #5a5296}
.btn.gold{background:#7a5414;box-shadow:inset 0 -3px 0 #3a2806,inset 0 0 0 2px #e0b040}
.btn.red{background:#6a1a22;box-shadow:inset 0 -3px 0 #3a0a10,inset 0 0 0 2px #d0485a}
.btn.green{background:#1e5a2a;box-shadow:inset 0 -3px 0 #0c2a12,inset 0 0 0 2px #5ad070}
.btn:disabled{opacity:.45;filter:grayscale(.7)}
.px{background:#12101fef;border:2px solid #000;box-shadow:inset 0 0 0 2px #3f3966,0 3px 0 #000}
/* HUD */
#hud{position:absolute;left:0;top:0;width:360px;pointer-events:none;padding:5px 6px 0}
#hudTop{display:flex;align-items:center;gap:5px}
#lvBadge{width:38px;height:38px;flex:none;background:#2b2147;border:2px solid #000;box-shadow:inset 0 0 0 2px #9a7cff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#lvBadge span{font-size:8px;color:#c8b8ff}#lvBadge b{font-size:16px}
#bars{flex:1;display:flex;flex-direction:column;gap:2px}
.bar{position:relative;height:11px;background:#1a0d12;border:2px solid #000;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;display:block}
.bar span{position:absolute;inset:0;font-size:8px;line-height:8px;text-align:center;color:#fff}
.bar.hp i{background:linear-gradient(#ff6a6a 0 30%,#d8283a 30% 75%,#9a1424 75%)}
.bar.mp i{background:linear-gradient(#7ac8ff 0 30%,#2a78e8 30% 75%,#1a4aa8 75%)}
.bar.mp{background:#0a1220}
.bar.xp{height:7px;background:#14102a}.bar.xp i{background:linear-gradient(#e8d0ff 0 40%,#a46cff 40%)}
#goldBox{flex:none;min-width:70px;height:26px;display:flex;align-items:center;gap:4px;padding:0 6px;background:#12101fdd;border:2px solid #000;box-shadow:inset 0 0 0 2px #7a5a1a;font-size:13px;color:#ffd75a}
.coinico{width:12px;height:12px;display:inline-block;background:radial-gradient(circle at 40% 35%,#fff6b0 0 15%,#ffd23a 16% 55%,#c98a10 56% 70%,transparent 71%);image-rendering:pixelated}
#hudRow2{display:flex;align-items:center;gap:4px;margin-top:4px}
#floorTxt{font-size:10px;line-height:1.1;flex:1;min-width:0;color:#e8dcc0;background:#12101fcc;border:2px solid #000;padding:2px 4px;white-space:nowrap;overflow:hidden}
#floorTxt small{color:#a89cc8;font-size:9px}
.hb{pointer-events:auto;position:relative;font-size:9px;padding:4px 0;width:40px;height:26px;background:#2a2545;border:2px solid #000;box-shadow:inset 0 -2px 0 #16132a,inset 0 0 0 2px #5a5296}
.hb.on{background:#1e6a32;box-shadow:inset 0 -2px 0 #0c2a12,inset 0 0 0 2px #6ae082;color:#eaffea}
.hb em{position:absolute;right:-5px;top:-6px;font-style:normal;background:#ff3a5a;color:#fff;border:2px solid #000;font-size:8px;min-width:14px;height:14px;line-height:10px;border-radius:7px;display:none}
.hb em.show{display:block;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.2)}}
@keyframes nrb{50%{background:#fff7b0;box-shadow:0 0 6px #ffe95a}}
#bossBar{margin:5px 20px 0;text-align:center}
#bossBar span{font-size:10px;color:#ffb06a;display:block;margin-bottom:1px}
.bar.boss{height:10px}.bar.boss i{background:linear-gradient(#ffb06a 0 30%,#e0541a 30%)}
/* ability bar */
#abar{position:absolute;left:82px;bottom:5px;width:188px;height:112px;display:grid;grid-template-columns:repeat(5,36px);grid-template-rows:repeat(3,36px);gap:2px}
.ab{position:relative;width:36px;height:36px;padding:0;background:#221d3a;border:2px solid #000;box-shadow:inset 0 -3px 0 #120f22,inset 0 0 0 2px #5a5296;overflow:hidden;touch-action:none}
.ab img{position:absolute;left:50%;top:8px;width:20px;height:20px;margin-left:-10px;image-rendering:pixelated}
.ab .k{position:absolute;left:3px;top:1px;font-size:7px;color:#a89cc8}
.ab .mc{position:absolute;right:3px;top:1px;font-size:7px;color:#7ac8ff}
.ab .nm{position:absolute;left:0;right:0;bottom:3px;font-size:7px;text-align:center;color:#e8dcc0;white-space:nowrap;overflow:hidden}
.ab .cdo{position:absolute;inset:0;background:conic-gradient(rgba(5,3,12,.72) var(--p,0deg),transparent 0);pointer-events:none}
.ab .cdt{position:absolute;left:0;right:0;top:11px;font-size:11px;text-align:center;color:#fff;pointer-events:none}
.ab .lk{position:absolute;inset:0;background:#0b0915e8;display:none;flex-direction:column;align-items:center;justify-content:center;font-size:9px;color:#8a80a8;pointer-events:none}
.ab .lk img{position:static;margin:0 0 1px;width:12px;height:12px}
.ab.newab{animation:newab 1.2s 2}@keyframes newab{0%,100%{box-shadow:inset 0 0 0 2px #b9a3ff}50%{box-shadow:inset 0 0 0 2px #fff,0 0 12px #ffe95a;background:#4a3a8a}}
.ab.locked .lk{display:flex}
.ab.nomana img{filter:grayscale(.8) brightness(.7)}
.ab.nomana .mc{color:#ff6a6a}
.ab.ready{box-shadow:inset 0 -3px 0 #120f22,inset 0 0 0 2px #b9a3ff}
.ab.fired{animation:fired .2s}
@keyframes fired{0%{background:#8a7aff}100%{background:#221d3a}}
.ab.deny{animation:deny .25s}
@keyframes deny{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
/* parry / burst */
#pbox{position:absolute;inset:0;pointer-events:none}
#bParry{position:absolute;left:5px;top:558px;width:74px;height:74px;border-radius:50%;padding:0;pointer-events:auto;touch-action:none;background:radial-gradient(circle at 40% 35%,#8a6a1a,#3a2608 72%);border:2px solid #000;box-shadow:inset 0 0 0 3px #ffd75a,0 2px 0 #000;font-size:12px;letter-spacing:1px;color:#eaf4ff}
#bParry b{display:block;font-size:24px;line-height:24px;margin-top:-2px}
#bParry.cool{filter:brightness(.6) grayscale(.4)}
#bParry.ready{animation:pready .35s infinite}@keyframes pready{50%{box-shadow:inset 0 0 0 3px #fff6c0,0 0 20px #ffd23a,0 0 6px #fff;transform:scale(1.07)}}
#bParry.fired{animation:pfire .25s}@keyframes pfire{0%{transform:scale(.88);box-shadow:inset 0 0 0 3px #fff,0 0 18px #ffd75a}100%{transform:none}}
#bParry.prompt{animation:pprom .5s infinite}@keyframes pprom{50%{box-shadow:inset 0 0 0 3px #ffe95a,0 0 22px #ffe95a;transform:scale(1.1)}}
#bBurst{position:absolute;left:15px;top:500px;width:52px;height:52px;border-radius:50%;padding:0;pointer-events:auto;touch-action:none;border:2px solid #000;--p:0deg;background:conic-gradient(#6a9aff var(--p),#141026 0);font-size:8px;color:#bfe6ff}
#bBurst::before{content:'';position:absolute;inset:5px;border-radius:50%;background:#12101f}
#bBurst span{position:relative;display:block;line-height:1.1}
#bBurst.full{background:conic-gradient(#dff4ff 360deg,#dff4ff 0);animation:bfull .6s infinite}@keyframes bfull{50%{box-shadow:0 0 16px #9cc0ff,0 0 4px #fff}}
#bBurst.full::before{background:#2a4aa8}
#bBurst.fired{animation:pfire .3s}
#chainTxt{position:absolute;left:5px;top:458px;width:74px;text-align:center;font-size:16px;color:#ffe9a8;text-shadow:2px 2px 0 #000,0 0 6px #ff9a2a}
#chainTxt.pop{animation:cpop .3s}@keyframes cpop{0%{transform:scale(1.8)}100%{transform:none}}
#echoTxt{position:absolute;left:5px;top:482px;width:74px;text-align:center;font-size:8px;color:#9ac8ff}
#pprompt{position:absolute;left:0;right:0;top:300px;text-align:center;pointer-events:none;z-index:12}
#pprompt div{display:inline-block;font-size:24px;color:#ffe95a;letter-spacing:2px;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,0 0 14px #ffb02e;animation:pulse .6s infinite}
#pprompt p{margin:6px 0 0;font-size:11px;color:#fff;text-shadow:1px 1px 0 #000}
/* draft / results / sanctum */
#draft{display:flex;flex-direction:column;gap:6px}
.rcard{display:flex;gap:8px;align-items:center;text-align:left;padding:8px;box-shadow:inset 0 0 0 2px var(--rc),0 0 8px color-mix(in srgb,var(--rc) 40%,transparent);background:#1a1630;min-height:84px}
.rcard img{width:44px;height:44px;flex:none;image-rendering:pixelated;background:#0c0a16;border:2px solid #000}
.rcard .rin{flex:1;min-width:0}.rcard .rt{font-size:8px;color:var(--rc);letter-spacing:1px}.rcard .nm{font-size:13px;color:var(--rc)}.rcard .ds{font-size:10px;color:#f4ecd8;margin-top:3px;line-height:1.3;letter-spacing:0}
.rtitle{font-size:24px;color:#ff9a9a;letter-spacing:2px;text-shadow:2px 2px 0 #3a0a10,0 0 12px #ff3a3a}.rtitle.won{color:#ffe9a8;text-shadow:2px 2px 0 #7a1f2b,0 0 12px #ff8a2a}
.nrec{font-style:normal;margin-left:9px;font-size:8px;color:#000;background:#ffe95a;padding:0 3px;animation:nrb 1s infinite;display:inline-block}
.shardbox{padding:8px;background:#0c0a16;border:2px solid #000;box-shadow:inset 0 0 0 2px #4a6ad0}.shn{font-size:26px;color:#bfe6ff;text-shadow:0 0 10px #3a6aff}
.pips i{display:inline-block;width:6px;height:6px;margin-left:2px;background:#2a2545;border:1px solid #000}.pips i.on{background:#9cc0ff}
/* banner & toasts */
#banner{position:absolute;left:0;right:0;top:190px;text-align:center;pointer-events:none;opacity:0}
#banner.show{animation:ban 2.2s ease-out forwards}
#banner .bt{font-size:26px;letter-spacing:2px;color:#ffe9a8;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 0 12px #ff8a2a}
#banner .bs{font-size:13px;color:#e8dcc0;margin-top:4px;text-shadow:1px 1px 0 #000,0 0 6px #000}
@keyframes ban{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#toasts{position:absolute;left:0;right:0;top:112px;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
.toast{font-size:11px;background:#12101fdd;border:2px solid #000;padding:3px 8px;animation:toast 1.8s forwards}
@keyframes toast{0%{opacity:0;transform:translateY(6px)}10%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
/* modal */
#modal{position:absolute;inset:0;background:#05030ad0;display:flex;align-items:center;justify-content:center;z-index:20}
.panel{width:344px;max-height:620px;padding:10px;display:flex;flex-direction:column;animation:pin .18s ease-out}
@keyframes pin{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ph h2{margin:0;font-size:17px;letter-spacing:1px;color:#ffe9a8}
.x{width:30px;height:30px;font-size:14px;padding:0}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.sub{font-size:10px;color:#a89cc8}
/* tree */
#tree{position:relative;width:320px;height:388px;margin:0 auto}
#tree svg{position:absolute;inset:0}
.tier{position:absolute;left:0;font-size:8px;color:#6a6090}
.node{position:absolute;width:46px;height:46px;padding:0;background:#221d3a;border:2px solid #000;box-shadow:inset 0 0 0 2px #4a4470;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;line-height:1.1}
.node small{font-size:8px;color:#c8b8ff}
.node.locked{background:#14111f;color:#5a5470;box-shadow:inset 0 0 0 2px #2a2640}
.node.locked small{color:#4a4460}
.node.avail{box-shadow:inset 0 0 0 2px #b9a3ff,0 0 8px #8a6aff}
.node.maxed{background:#3a2a0a;box-shadow:inset 0 0 0 2px #ffd24a}
.node.cap{border-radius:50%;width:50px;height:50px}
.node.sel{outline:2px solid #fff;outline-offset:1px}
#tinfo{min-height:86px;margin-top:6px;padding:8px;font-size:11px;background:#0c0a16;border:2px solid #000}
#tinfo b{color:#ffe9a8}
/* shop */
.slots{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.slot{width:48px;height:48px;background:#0c0a16;border:2px solid #000;box-shadow:inset 0 0 0 2px #3f3966;display:flex;align-items:center;justify-content:center;position:relative}
.slot img{width:36px;height:36px;image-rendering:pixelated}
.slot span{position:absolute;bottom:-1px;left:0;right:0;font-size:7px;text-align:center;color:#8a80a8}
.tabs{display:flex;gap:4px;margin-bottom:6px}
.tabs button{flex:1;font-size:11px;padding:6px}
.tabs button.on{background:#4a3a8a}
.item{display:flex;gap:8px;align-items:center;padding:6px;margin-bottom:5px;background:#1a1630;border:2px solid #000;box-shadow:inset 0 0 0 2px var(--rc)}
.item img{width:40px;height:40px;flex:none;image-rendering:pixelated;background:#0c0a16;border:2px solid #000}
.item .in{flex:1;min-width:0}
.item .nm{font-size:11px;color:var(--rc)}
.item .rt{font-size:8px;color:var(--rc);opacity:.85;letter-spacing:1px}
.item .st{font-size:9px;color:#c8e8c8;margin-top:2px}
.item .ef{font-size:9px;color:#ffd75a;margin-top:2px;line-height:1.25}
.pfx{margin:10px auto 0;width:270px;padding:7px 8px;font-size:11px;line-height:1.4;color:#fff3c8;background:#0c0a16e0;border:2px solid var(--rc)}
.pfx b{color:var(--rc);letter-spacing:2px;font-size:10px}
#tut{position:absolute;inset:0;z-index:25;background:#05030ab8}
.tip{position:absolute;font-size:11px;line-height:1.35;background:#12101ff2;border:2px solid #000;box-shadow:inset 0 0 0 2px #9a7cff;padding:6px 8px;color:#f4ecd8}
.tip b{color:#ffe9a8}
.ring{position:absolute;border:3px dashed #ffe9a8;border-radius:10px;animation:pulse 1s infinite}
.item .ds{font-size:8px;color:#8a80a8;margin-top:1px}
.item button{flex:none;width:72px;font-size:10px;padding:6px 2px}
/* popup */
#popup{position:absolute;inset:0;z-index:30;background:#05030af2;display:flex;align-items:center;justify-content:center;overflow:hidden;--rc:#ffb52e}
#popup .rays{position:absolute;left:50%;top:44%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(from 0deg,var(--rc) 0 6deg,transparent 6deg 22deg);opacity:.28;border-radius:50%;animation:spin 9s linear infinite;-webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%)}
#popup .burst{position:absolute;left:50%;top:44%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--rc) 25%,transparent 65%);animation:burst .9s ease-out forwards}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes burst{0%{transform:scale(0);opacity:1}60%{opacity:.9}100%{transform:scale(1.7);opacity:.35}}
.pcard{position:relative;text-align:center;width:300px;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.1) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.pcard .ph1{font-size:14px;letter-spacing:2px;color:#fff;margin-bottom:6px}
.picon{width:112px;height:112px;image-rendering:pixelated;filter:drop-shadow(0 0 10px var(--rc)) drop-shadow(0 0 2px #fff);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.prar{display:inline-block;margin-top:6px;font-size:11px;letter-spacing:3px;color:#000;background:var(--rc);padding:2px 10px;border:2px solid #000;text-shadow:none}
.pname{font-size:18px;color:var(--rc);margin-top:6px;text-shadow:2px 2px 0 #000,0 0 10px var(--rc)}
.pstats{font-size:12px;color:#c8f0c8;margin-top:8px;line-height:1.5}
.ptap{font-size:10px;color:#a89cc8;margin-top:14px;opacity:0;animation:fadein .3s .9s forwards}
@keyframes fadein{to{opacity:1}}
.spk{position:absolute;left:50%;top:44%;width:6px;height:6px;background:var(--rc);box-shadow:0 0 6px #fff;animation:spk 1.1s ease-out forwards}
@keyframes spk{0%{transform:translate(0,0) scale(1.4);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(.3);opacity:0}}
/* title */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;z-index:10;padding-top:70px}
.logo{text-align:center;line-height:.9}
.logo .l1{font-size:46px;letter-spacing:6px;color:#ffe9a8;text-shadow:3px 3px 0 #7a1f2b,6px 6px 0 #000,0 0 18px #ff3a3a}
.logo .l2{font-size:36px;letter-spacing:4px;color:#f4ecd8;text-shadow:3px 3px 0 #3a3466,6px 6px 0 #000}
.tsub{margin-top:12px;font-size:11px;color:#c8b8ff;letter-spacing:2px;background:#0009;padding:3px 8px}
#tbtns{position:absolute;bottom:40px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:9px}
#tbtns .btn{width:230px;font-size:14px;padding:9px}
.tfoot{position:absolute;bottom:14px;font-size:9px;color:#6a6090;text-align:center;left:0;right:0}
.blink{animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.4}}
/* cards for floor choice */
.cards{display:flex;gap:6px;margin:10px 0}
.card{flex:1;padding:10px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:130px;justify-content:center}
.card img{width:36px;height:36px;image-rendering:pixelated}
.card b{font-size:16px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:11px}
.statgrid div{display:flex;justify-content:space-between;border-bottom:1px solid #2a2545;padding:2px 0}
.statgrid div span:last-child{color:#ffe9a8}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:40}
#fade.on{opacity:1}
#dbg{position:absolute;left:4px;top:118px;display:flex;flex-direction:column;gap:3px;z-index:15}
#dbg button{font-size:8px;padding:3px 4px;background:#400a;border:1px solid #f66;color:#fcc}
.center{text-align:center}
</style></head>
<body>
<div id="wrap"><div id="game">
<canvas id="cv"></canvas>
<div id="touch"></div>
<div id="hud" class="hide">
 <div id="hudTop">
  <div id="lvBadge"><span>LV</span><b id="lvNum">1</b></div>
  <div id="bars">
   <div class="bar hp"><i id="hpFill"></i><span id="hpTxt"></span></div>
   <div class="bar mp"><i id="mpFill"></i><span id="mpTxt"></span></div>
   <div class="bar xp"><i id="xpFill"></i></div>
  </div>
  <div id="goldBox"><i class="coinico"></i><b id="goldTxt">0</b></div>
 </div>
 <div id="hudRow2">
  <div id="floorTxt">FLOOR 1</div>
  <button id="bAfk" class="hb">AFK</button><button id="bRelics" class="hb">RELIC<em id="relBadge"></em></button><button id="bShop" class="hb">SHOP<em id="shopBadge">!</em></button><button id="bStats" class="hb">STATS</button><button id="bPause" class="hb">| |</button>
 </div>
 <div id="bossBar" class="hide"><span id="bossName"></span><div class="bar boss"><i id="bossFill"></i></div></div>
</div>
<div id="abar" class="hide"></div>
<div id="pbox" class="hide"><div id="chainTxt"></div><button id="bParry" aria-label="Parry"><b>&#9876;</b>PARRY</button><button id="bBurst" aria-label="Resonance Burst"><span>BURST</span><span id="resTxt">0%</span></button><div id="echoTxt"></div></div>
<div id="pprompt" class="hide"><div>GOLD ATTACK!</div><p>Gold attacks can be parried - tap PARRY to send them back! (Shift/K)</p></div>

function makeNoise(seed){const r=mulberry(seed);const N=64;const gr=new Float32Array(N*N);for(let i=0;i<N*N;i++)gr[i]=r();
 return (x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const i0=(yi&63)*N,i1=((yi+1)&63)*N,x0=xi&63,x1=(xi+1)&63;
 const a=gr[i0+x0],b=gr[i0+x1],c=gr[i1+x0],d=gr[i1+x1];const sx=xf*xf*(3-2*xf),sy=yf*yf*(3-2*yf);return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy}}

 for(let y=0;y<src.height;y++)for(let x=0;x<src.width;x++){if(d[(y*src.width+x)*4+3]>20){g.fillRect(x,y+1,3,1);g.fillRect(x+1,y,1,3)}}g.drawImage(src,1,1);return c}
function flipC(src){const [c,g]=mk(src.width,src.height);g.translate(src.width,0);g.scale(-1,1);g.drawImage(src,0,0);return c}

function rotC(src,deg){const w=src.width,h=src.height;if(deg===90){const [c,g]=mk(h,w);g.translate(0,w);g.rotate(-Math.PI/2);g.drawImage(src,0,0);return c}
 const S=w+h;const [c,g]=mk(S,S);g.translate(S/2,S-1);g.rotate(-deg*Math.PI/180);g.drawImage(src,-w/2,-h);return trimC(c)}

 for(let y=0;y<src.height;y++)for(let x=0;x<src.width;x++)if(d[(y*src.width+x)*4+3]>0){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}

function noise(dur,vol,freq,type,delay){const a=AU.ctx;if(!a||!AU.nb)return;const t=a.currentTime+(delay||0);const s=a.createBufferSource();s.buffer=AU.nb;const f=a.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq||1200;const g=a.createGain();
 g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(AU.master);s.start(t,Math.random()*.5);s.stop(t+dur+.02)}

function frameB(rows,legs){const g=gridFrom(rows);const h=g.length,w=g[0].length;const out=g.map(r=>r.map(()=>'.'));
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const c=g[y][x];if(c==='.')continue;if(legs&&y>=h-legs){const nx=x+(x<w/2?-1:1)*((y-h+legs)%2===0?1:0);if(nx>=0&&nx<w)out[y][nx]=c}else{const ny=Math.min(h-1,y+(legs?1:0));if(!legs){const nx=x;out[Math.max(0,y-1)][nx]=c}else out[ny][x]=c}}
 return out}

function newSave(){return {v:2,active:false,lvl:1,xp:0,gold:0,bonus:{hp:0,mana:0,atk:0},owned:['tanto'],weapon:'tanto',acc:[],floor:1,notified:[],kills:0,time:0,

function loadGame(){loadMeta();try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s&&s.v===2){save=Object.assign(newSave(),s);save.bonus=Object.assign({hp:0,mana:0,atk:0},s.bonus||{});return true}}catch(e){}save=newSave();return false}
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));saveMeta()}catch(e){}}
function resetSave(){try{localStorage.removeItem(SAVE_KEY);localStorage.removeItem(META_KEY)}catch(e){}const p=meta.prefs;meta=newMeta();meta.prefs=Object.assign(meta.prefs,{sound:p.sound});save=newSave()}
function hasR(id){return save.relics.includes(id)}
function heatOn(id){return !!(save.heat&&save.heat[id])}
function heatBonus(h){h=h||save.heat;let b=0;for(const x of HEATS)if(h[x.id])b+=x.bonus;return b}
function newRun(opt){opt=opt||{};const nr=newSave();nr.active=true;nr.started=true;nr.daily=!!opt.daily;
 if(opt.daily){nr.dayKey=opt.dayKey||dateKey();nr.seed=dailySeed(nr.dayKey);const r=mulberry(nr.seed^0x9e37);const ids=HEATS.map(h=>h.id);const a=Math.floor(r()*ids.length);let b=Math.floor(r()*(ids.length-1));if(b>=a)b++;nr.heat={[ids[a]]:1,[ids[b]]:1}}
 else{nr.seed=(opt.seed!=null?opt.seed:(Math.random()*4294967296)>>>0);nr.heat=Object.assign({},meta.heat)}
 nr.rerolls=U('reroll');save=nr;meta.runs++;saveGame();return nr}

function calcStats(){const s={maxHp:100+save.bonus.hp*20+(save.lvl-1)*7,maxMana:50+save.bonus.mana*10+(save.lvl-1)*3,atk:10+save.bonus.atk*3+(save.lvl-1)*1.2,
 atkPct:0,hpPct:0,manaPct:0,crit:.05,critDmg:.5,luck:0,aspd:0,move:0,regen:0,cdr:0,life:0,def:0};
 s.atk=Math.round(s.atk);
 const add=st=>{for(const k in st){const v=st[k];if(k==='hp')s.maxHp+=v;else if(k==='mana')s.maxMana+=v;else if(k==='atk')s.atk+=v;else s[k]+=v}};
 for(const id of [save.weapon,...save.acc].filter(Boolean)){const it=ITEM[id];if(it)add(it.st)}
 for(const id of save.relics){const r=RELIC[id];if(r)add(r.st)}
 s.hpPct+=U('vit')*.08;s.atkPct+=U('mig')*.06;s.manaPct+=U('spi')*.10;s.regen+=U('spi')*.10;s.luck+=U('treasure')*.15;
 if(heatOn('austere'))s.life*=.5;
 s.maxHp=Math.round(s.maxHp*(1+s.hpPct));s.maxMana=Math.round(s.maxMana*(1+s.manaPct));
 s.crit=Math.min(1,s.crit);s.cdr=Math.min(.5,s.cdr);s.def=Math.min(.7,s.def);
 s.manaRegen=5*(1+s.regen)+save.lvl*.15;s.speed=96*(1+s.move);
 // parry / echo derived
 s.pWin=(.25+U('steady')*.015+(hasR('mirror')?.05:0)-(heatOn('narrow')?.04:0));s.pZone=60+U('steady')*4+(hasR('mirror')?14:0)-(heatOn('narrow')?12:0);
 s.afkParry=.25+U('instinct')*.08;s.echoDur=6+U('echo')+(hasR('shard')?2:0);s.echoMax=3+(hasR('fourth')?1:0);s.echoMul=hasR('hollow')?.6:.4;
 s.resGain=hasR('core')?1.35:1;return s}

function genMap(n){
 if(NEWMAP[FLOORS[n-1].theme])return genThemeMap(n);
 const F=FLOORS[n-1],th=F.theme,seed=1000+n*7919,R=mulberry(seed),nz=makeNoise(seed),nz2=makeNoise(seed+77);

function findSpawn(minD){const h=G.hero,r=G.rng;for(let t=0;t<40;t++){const x=PL.l+16+r()*(PL.r-PL.l-32),y=clamp(h.y-300+r()*560,PL.t+16,PL.b-16);

function num(x,y,txt,col,size){if(G.nums.length>60)G.nums.shift();G.nums.push({x:x+rand(-4,4),y,txt:String(txt),col,size:size||11,t:0})}
function shake(v){G.shake=Math.max(G.shake,v)}
function hitStop(t){G.hitStop=Math.max(G.hitStop,Math.min(.07,t))}
function slowMo(t,s){if(G.slowT<t){G.slowT=t;G.slowS=s}}

function dealDamage(e,mult,o){if(!e||e.dead)return 0;o=o||{};const st=G.st;const crit=!o.noCrit&&Math.random()<st.crit;

 num(e.x,e.y-(e.boss?60:26),crit?d+'!':d,crit?'#ffcf3a':(o.col||(o.echo?'#9ac8ff':'#ffffff')),crit?15:(o.small?9:mult>=3?14:11));

 if(crit){G.fx.push({kind:'spark',x:e.x,y:e.y-14,t:0,dur:.16,a:rand(0,3)})}

  if(hasIt('medusa')&&!(e.stone>0)&&Math.random()<.10){e.stone=e.boss?.8:2;num(e.x,e.y-(e.boss?74:38),'PETRIFIED','#c8c8d0',9);burst(e.x,e.y-12,10,'#a8a8b0',60,.4,2)}

 sfx(crit?'crit':'hit');if(e.hp<=0)killEnemy(e);return d}

function relicPool(){return RELICS.filter(x=>!save.relics.includes(x.id)&&(!x.lock||meta.unlocked.includes(x.id)))}
function draftFor(n,rr,start){const r=mulberry((save.seed+n*977+rr*31+(start?5557:0))>>>0);const pool=relicPool();const out=[];
 const w=[55,30,12+n*.8,3+n*.5];const nRel=start?3:2;
 for(let k=0;k<nRel;k++){const avail=[0,1,2,3].filter(q=>pool.some(x=>x.rar===q&&!out.some(o=>o.id===x.id)));if(!avail.length)break;
  let tot=avail.reduce((a,q)=>a+w[q],0),roll=r()*tot,rar=avail[0];for(const q of avail){roll-=w[q];if(roll<=0){rar=q;break}}
  const c=pool.filter(x=>x.rar===rar&&!out.some(o=>o.id===x.id));out.push({type:'relic',id:c[Math.floor(r()*c.length)].id})}
 if(!start)out.push({type:'bless',id:BLESS[Math.floor(r()*3)].id});
 while(out.length<3)out.push({type:'bless',id:BLESS[out.length%3].id});return out}

 <div class="sub" style="margin:2px 0 8px">${R.daily?'Daily Challenge '+R.dayKey+(R.dailyRec?' &middot; <b style="color:#ffe95a">NEW DAILY BEST</b>':''):'Run '+meta.runs}${Object.keys(R.heat).length?' &middot; Heat: '+HEATS.filter(x=>R.heat[x.id]).map(x=>x.name).join(', '):''}</div>
 <img src="${heroPortraitURL(4)}" style="width:60px;height:70px;image-rendering:pixelated;filter:drop-shadow(0 0 2px #9cc0ff) drop-shadow(0 0 8px #3a6aff)${R.won?'':' grayscale(.5)'}">
 <div class="statgrid res" style="margin:8px 4px;text-align:left;grid-template-columns:1fr">${row('Floor reached',R.floor+' / '+RUN_MAX,R.rec.floor)}${row('Enemies slain',R.kills,R.rec.kills)}${row('Perfect parries',R.parries,R.rec.parries)}${row('Best chain','x'+R.bestChain,R.rec.chain)}${row('Resonance Bursts',R.bursts)}${row('Level',R.lvl)}${row('Relics',R.relics.length)}${row('Time',Math.floor(t/60)+'m '+Math.floor(t%60)+'s')}</div>
 <div class="shardbox"><div class="sub">SOUL SHARDS EARNED</div><div class="shn">+${R.shards.total}</div><div class="sub">${R.shards.base} base${R.shards.mult>1?` x ${R.shards.mult.toFixed(2)} (heat & Shard Seeker)`:''} &middot; total ${meta.shards}</div></div>
 <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px"><button class="btn gold" id="rSan">SANCTUM</button><button class="btn green" id="rNew">NEW RUN</button><button class="btn" id="rTitle">TITLE</button></div></div>`,{closable:false,kind:'results'});
 sfx(R.won?'clear':'die');
 $('rSan').onclick=()=>{closeModal();openSanctum(()=>toTitle())};$('rNew').onclick=()=>{closeModal();startRun({})};$('rTitle').onclick=()=>{closeModal();toTitle()}}
/* ================= SANCTUM (meta) ================= */
let sanTab='upg';
function buyUpg(id){const u=UPGS.find(x=>x.id===id);const l=U(id);if(!u||l>=u.max)return false;const c=upgCost(u,l);if(meta.shards<c){sfx('deny');return false}meta.shards-=c;meta.upg[id]=l+1;saveMeta();sfx('level');return true}
function unlockRelic(id){const r=RELIC[id];if(!r||!r.lock||meta.unlocked.includes(id))return false;if(meta.shards<r.lock){sfx('deny');return false}meta.shards-=r.lock;meta.unlocked.push(id);saveMeta();sfx('buy');return true}
function openSanctum(back){G.sanBack=back||G.sanBack;sfx('click');renderSanctum()}
function renderSanctum(){let body='';
 if(sanTab==='upg')body=UPGS.map(u=>{const l=U(u.id),mx=l>=u.max,c=mx?0:upgCost(u,l);const pips=Array.from({length:u.max},(_,i)=>`<i class="${i<l?'on':''}"></i>`).join('');
  return `<div class="item" style="--rc:#7a9aff"><div class="in"><div class="nm">${u.name} <span class="pips">${pips}</span></div><div class="st">${u.d(Math.max(1,mx?l:l+1))}${!mx&&l?` <span class="sub">(now: ${u.d(l)})</span>`:''}</div></div><button class="btn gold" data-up="${u.id}" ${mx||meta.shards<c?'disabled':''}>${mx?'MAX':c+' &#9670;'}</button></div>`}).join('');
 else if(sanTab==='codex')body=RELICS.filter(r=>r.lock).map(r=>{const has=meta.unlocked.includes(r.id),c=RAR[r.rar];return `<div class="item" style="--rc:${c.c}"><img src="${ICON['relic'+r.rar]}"><div class="in"><div class="rt">${c.n}</div><div class="nm">${r.name}</div><div class="ef">${r.d}</div></div><button class="btn gold" data-un="${r.id}" ${has||meta.shards<r.lock?'disabled':''}>${has?'OWNED':r.lock+' &#9670;'}</button></div>`}).join('')+`<div class="sub center" style="margin-top:4px">Unlocked relics join the floor-clear draft pool.</div>`;
 else body=`<div class="sub center" style="margin-bottom:6px">Heat makes runs harder and boosts Soul Shards.</div>`+HEATS.map(h=>`<div class="item" style="--rc:#ff7a4a"><div class="in"><div class="nm">${h.name}</div><div class="st">${h.d} &middot; <span style="color:#ffe95a">+${Math.round(h.bonus*100)}% shards</span></div></div><button class="btn ${meta.heat[h.id]?'red':''}" data-heat="${h.id}">${meta.heat[h.id]?'ON':'OFF'}</button></div>`).join('')+`<div class="center" style="font-size:12px;color:#ffb08a;margin-top:4px">Shard bonus: +${Math.round(heatBonus(meta.heat)*100)}%</div>`;
 openModal(head(`SANCTUM <span class="sub" style="color:#bfe6ff">&#9670; <b id="shardN">${meta.shards}</b> shards</span>`)+`<div class="tabs"><button class="btn ${sanTab==='upg'?'on':''}" data-st="upg">UPGRADES</button><button class="btn ${sanTab==='codex'?'on':''}" data-st="codex">RELIC CODEX</button><button class="btn ${sanTab==='heat'?'on':''}" data-st="heat">HEAT</button></div>
 <div class="scroll" style="max-height:430px">${body}</div><div class="sub center" style="margin-top:6px">Best floor ${meta.bestFloor} &middot; best chain x${meta.bestChain} &middot; runs ${meta.runs} &middot; clears ${meta.clears}</div>`,{kind:'sanctum',onClose:()=>{const b=G.sanBack;G.sanBack=null;if(b)b()}});
 const p=$('mp');p.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{sanTab=b.dataset.st;sfx('click');keepBack(renderSanctum)});
 p.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{buyUpg(b.dataset.up);keepBack(renderSanctum)});
 p.querySelectorAll('[data-un]').forEach(b=>b.onclick=()=>{unlockRelic(b.dataset.un);keepBack(renderSanctum)});
 p.querySelectorAll('[data-heat]').forEach(b=>b.onclick=()=>{const id=b.dataset.heat;if(meta.heat[id])delete meta.heat[id];else meta.heat[id]=1;saveMeta();sfx('click');keepBack(renderSanctum)})}
function keepBack(fn){const b=G.sanBack;MODAL.onClose=null;fn();G.sanBack=b}
/* ================= TITLE ================= */
function toTitle(){clearBanner();G.mode='title';G.map=null;G.paused=false;G.echoes=[];G.allies=[];showHUD(false);$('bossBar').classList.add('hide');$('modal').classList.add('hide');$('pprompt').classList.add('hide');
 const has=save.active;const tb=$('tbtns');const dk=dateKey(),db=meta.daily[dk];
 tb.innerHTML=(has?`<button class="btn gold" id="tCont">CONTINUE RUN<br><span style="font-size:10px">Floor ${save.floor} &middot; Lv ${save.lvl} &middot; ${save.relics.length} relics${save.daily?' &middot; daily':''}</span></button>`:'')+
 `<button class="btn ${has?'':'gold'}" id="tNew">${has?'NEW RUN':'START RUN'}</button><button class="btn" id="tDaily">DAILY CHALLENGE<br><span style="font-size:10px">${dk}${db?` &middot; best F${db.floor}`:''}</span></button><button class="btn" id="tSan">SANCTUM <span style="color:#bfe6ff;font-size:12px">&#9670;${meta.shards}</span></button>`+
 `<div class="sub" style="margin-top:2px">${meta.runs?`Best floor ${meta.bestFloor}/${RUN_MAX} &middot; best chain x${meta.bestChain} &middot; ${meta.runs} runs`:'Clear 10 floors. Parry. Echo. Ascend.'}</div><button class="btn red" id="tReset" style="font-size:10px;width:140px;padding:5px">RESET ALL DATA</button>`;
 if(has)$('tCont').onclick=()=>{auInit();sfx('click');continueRun()};
 const confirmNew=fn=>{if(!save.active){fn();return}openModal(head('NEW RUN?',false)+`<div class="center" style="padding:10px;font-size:12px">Abandon the current run (Floor ${save.floor})? It ends without shards.</div><div style="display:flex;gap:8px;justify-content:center;padding-bottom:6px"><button class="btn" id="nNo">CANCEL</button><button class="btn red" id="nYes">ABANDON</button></div>`,{closable:false});$('nNo').onclick=()=>{closeModal();toTitle()};$('nYes').onclick=()=>{closeModal();fn()}};
 $('tNew').onclick=()=>{auInit();sfx('click');confirmNew(()=>startRun({}))};
 $('tDaily').onclick=()=>{auInit();sfx('click');confirmNew(()=>startRun({daily:true}))};
 $('tSan').onclick=()=>{auInit();$('title').classList.add('hide');openSanctum(()=>toTitle())};
 $('tReset').onclick=()=>{sfx('click');$('title').classList.add('hide');openModal(head('RESET ALL DATA?',false)+`<div class="center" style="padding:10px;font-size:12px;line-height:1.6">This erases your run, Soul Shards, Sanctum upgrades and records.<br>This cannot be undone.</div><div style="display:flex;gap:8px;justify-content:center;padding-bottom:6px"><button class="btn" id="rNo">CANCEL</button><button class="btn red" id="rYes">ERASE</button></div>`,{closable:false});
  $('rNo').onclick=()=>{closeModal();toTitle()};$('rYes').onclick=()=>{resetSave();closeModal();toTitle();toast('All data erased')}}}
function continueRun(){const P=save.pending;G.st=calcStats();
 if(P&&(P.kind==='draft'||P.kind==='start')){G.mode='play';G.map=genMap(Math.max(1,P.n));G.fs={n:Math.max(1,P.n),phase:'choice'};G.hero=newHero();showHUD(false);$('title').classList.add('hide');openDraft();return}
 if(P&&P.kind==='shop'){G.mode='play';G.map=genMap(P.n);G.fs={n:P.n,phase:'choice'};G.hero=newHero();showHUD(false);$('title').classList.add('hide');openArmory(P.n);return}
 fadeTo(()=>startFloor(save.floor))}
/* ================= BOOT ================= */
function fit(){const k=Math.min(innerWidth/W,innerHeight/H);$('game').style.transform=`scale(${k})`;const dpr=window.devicePixelRatio||1;const r=clamp(Math.ceil(k*dpr),2,3);if(r!==RES||cv.width!==W*r){RES=r;cv.width=W*r;cv.height=H*r}ctx.imageSmoothingEnabled=false}
addEventListener('resize',fit);
['bAfk','bRelics','bShop','bStats','bPause','tut'].forEach(id=>$(id).addEventListener('pointerdown',e=>{e.stopPropagation()}));
$('bAfk').onclick=()=>{auInit();toggleAfk()};$('bRelics').onclick=()=>{auInit();openRelics()};$('bShop').onclick=()=>{auInit();openShop()};$('bStats').onclick=()=>{auInit();openStats()};$('bPause').onclick=()=>{auInit();openPause()};
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveGame();if(G.mode==='play'&&!G.paused)openPause()}});
let lastT=performance.now();
function frame(t){let dt=Math.min(.05,Math.max(0,(t-lastT)/1000));lastT=t;G.fpsLog.push(dt);if(G.fpsLog.length>240)G.fpsLog.shift();try{for(let i=0;i<G.speed;i++)update(dt);render();updateHUD()}catch(err){console.error(err)}requestAnimationFrame(frame)}
function boot(){buildHero();buildEnemies();buildEnemies2();buildIcons();makeVig();loadGame();G.st=calcStats();buildAbar();buildDebug();fit();toTitle();requestAnimationFrame(frame)}
window.LE={goldTargets,rollGold,reflectProj,G,floorDef,FLOORS,ETYPES,afkRoll,parryCoins,perfectParry,tel,get save(){return save},set save(v){save=v},get meta(){return meta},startFloor,castAbility,doAbility,calcStats,openShop,openArmory,buyItem,spawnDrop,gainXP,JOY,ITEMS,ABIL,RELICS,RELIC,UPGS,HEATS,FLOORS,xpNeed,toTitle,
 pressParry,useBurst,canBurst,spawnEcho,spawnEnemy,hurtHero,startRun,newRun,endRun,draftFor,pickDraft,openDraft,openSanctum,buyUpg,unlockRelic,dailySeed,dateKey,continueRun,calcShards,loadGame,saveGame,killEnemy,dealDamage,nextWave,refreshStats,clearBanner};
boot();
